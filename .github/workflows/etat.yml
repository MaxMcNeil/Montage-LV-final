name: État

# Écrit ETAT.md : état de chaque workflow, cause des échecs en clair, quand ça se débloque, quoi faire.
# Ne modifie aucun autre workflow. Commit seulement si l'état change.
on:
  workflow_run:
    workflows: ["Montage final"]
    types: [completed]
  workflow_dispatch:      # aucune exécution planifiée : seulement après tes propres lancements, ou à la main

permissions:
  contents: write
  actions: read

concurrency:
  group: etat
  cancel-in-progress: true

jobs:
  etat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            ETAT.md
          sparse-checkout-cone-mode: false
      - name: État des workflows (enregistré seulement si l'état change)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .github/etat/etat.py /tmp/etat.py
          # chaque essai repart du dépôt À JOUR : jamais de conflit avec un autre workflow qui écrit en même temps
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            python3 /tmp/etat.py > /tmp/etat.log
            grep -q '^CHANGED$' /tmp/etat.log || { echo "État inchangé"; exit 0; }
            git add ETAT.md
            git diff --cached --quiet && exit 0
            git commit -q -m "état des workflows"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && { echo "ETAT.md enregistré"; exit 0; }
            sleep $((i * 5))
          done
          echo "::warning::ETAT.md non enregistré (dépôt très actif) : il le sera au prochain passage"

