name: Montage final

# Dépose ta vidéo dans une Release dont le tag commence par « montage » (montage-001, montage-002…).
# Joins aussi tes photos / vidéos : elles seront placées au bon moment. Vidéo trop lourde : lien Google Drive dans
# la description. Tu peux écrire des consignes et des réglages dans la description (voir README).
# Résultat : release « 🎬 RÉSULTAT — Montage final » (ou Google Drive si > 1,9 Go) + PLAN.md (quoi / où / quand).
# 📌 RÉFLEXE : titre du résultat / 1re ligne de PLAN.md → « ✅ prêt à publier » = publie ; « ⚠ à vérifier » = PLAN.md
#    dit quoi et à quel moment : regarde ce passage avant de publier.

# LANCEMENT MANUEL UNIQUEMENT (Actions → Run workflow) : déposer une vidéo ou une photo ne déclenche plus rien.
# Seule exception : la chaîne lancée par le dépôt fond vert (repository_dispatch « chaine-montage » ci-dessous).
on:
  # 🔗 CHAÎNE : lancé automatiquement par le dépôt fond vert (case « enchainer »), jamais par un cron
  repository_dispatch:
    types: [chaine-montage]
  workflow_dispatch:
    inputs:
      source:
        description: "Vidéo — VIDE = ta vidéo « moi… » déposée dans le dossier Drive montage-joints (avec tes extraits). Sinon : gdrive:dossier/moi.mp4, lien Drive ou tag de release. 📌 Après : titre ✅ = publie, ⚠ = regarde PLAN.md"
        required: false
        default: ""
      pieces_jointes:
        description: "Photos / vidéos EN PLUS du dossier Drive montage-joints (toujours pris) : chemins Drive (gdrive:dossier), liens Google Drive et/ou tags de releases (ex : video), séparés par des espaces"
        required: false
        default: ""
      consignes:
        description: "Consignes pour le monteur (ex : la photo 2 est le ministre ; insiste sur les chiffres)"
        required: false
        default: ""
      couper_silences:
        description: "Raccourcir tes silences"
        type: choice
        options: [défaut, doux, dynamique, non]
        default: défaut
      sous_titres:
        description: "Sous-titres (non par défaut : aucun sous-titre, ni ta voix ni les extraits)"
        type: choice
        options: [non, oui]
        default: non
      ouverture_choc:
        description: "Commencer par le passage le plus choquant de ta vidéo jointe (release / Drive), dans un cadre à côté de toi (jamais plein écran) ; aucune vidéo jointe = début normal"
        type: choice
        options: [oui, non]
        default: oui
      mots_cles:
        description: "Mots-clés : après « écoutez ça / écoutez-moi ça / écoutez ce qu'il (elle) dit / ce qu'ils disent », insérer le passage de la vidéo jointe qui correspond"
        type: choice
        options: [oui, non]
        default: oui
      effets_sonores:
        description: "Petits souffles discrets aux transitions (aucune musique)"
        type: choice
        options: [défaut, oui, non]
        default: défaut
      voix_studio:
        description: "Voix studio (clarté, débruitage doux, volume régulier) — contrôlée : repli sur ta voix normale au moindre doute"
        type: choice
        options: [non, oui]
        default: non
      chaine:
        description: "Chaîne (logo, couleurs) : auto = selon la langue de la vidéo ; sinon dossier chaines/<code>"
        type: choice
        options: [auto, fr, ar, it, en, non]
        default: auto
      recherche_presse:
        description: "🔎 Recherche légère (presse, vidéos, Telegram, Reddit) selon ta vidéo, économe pour ta clé Gemini : au plus 4 sujets, aucune vidéo regardée par Gemini. non = seulement tes fichiers"
        type: choice
        options: [oui, non]
        default: oui
      format_sortie:
        description: "🖼 Format de la vidéo montée : auto = même format que ta vidéo · horizontal ou vertical = forcé (mêmes cartes, animations et inserts)"
        type: choice
        options: [auto, horizontal, vertical]
        default: auto
      version_verticale:
        description: "📱 Vidéo HORIZONTALE : faire aussi une version verticale (pour les Shorts, rien de coupé). auto = seulement si les Shorts sont enchaînés"
        type: choice
        options: [auto, oui, non]
        default: auto
      reprendre:
        description: "♻ Relance : reprendre les pièces jointes du DERNIER montage réussi (rangées dans Drive « montage-joints-utilises »)"
        type: choice
        options: [non, oui]
        default: non
      vitesse:
        description: "⏩ Vitesse de ta parole : 1 = normale · 1.1 = 10 % plus rapide (0.8 à 1.5) — voix inchangée, image et son synchro. En chaîne depuis le fond vert : déjà appliquée là-bas, ignorée ici"
        default: "1"
      chaine_shorts:
        description: "🔗 Enchaîner les Shorts (Push-overlay) après ce montage"
        type: choice
        options: [non, oui]
        default: non
      shorts_sous_titres:
        description: "🔗 Sous-titres dans les Shorts enchaînés (gros, lisibles, jamais sur ton visage) : oui / non"
        type: choice
        options: [oui, non]
        default: oui

permissions:
  contents: write
  actions: read

concurrency:
  group: montage-${{ github.event.client_payload.chaine_id || github.event.release.tag_name || inputs.source || github.ref }}
  cancel-in-progress: false

jobs:
  # Tri en quelques secondes : une release de pièces jointes (sans fichier « moi… ») ne lance PAS tout l'outillage,
  # elle passe juste en 📎 EN ATTENTE. Rien n'est jamais supprimé.
  tri:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'out-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/fetch_inputs.py tri

  montage:
    needs: tri
    if: needs.tri.outputs.go == '1'
    outputs:
      chaine_id: ${{ github.event.client_payload.chaine_id }}
      video_url: ${{ steps.pubc.outputs.video_url || steps.pub.outputs.video_url }}
      video_id: ${{ steps.pubc.outputs.video_id || steps.pub.outputs.video_id }}
      video_nom: ${{ steps.pubc.outputs.video_nom || steps.pub.outputs.video_nom }}
      joints: ${{ steps.pubc.outputs.joints }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SRC_TAG: ${{ github.event.release.tag_name }}
      # IA gratuite : mêmes secrets que Vid-o-presse-finder (rotation des clés, bascule automatique)
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
      GEMINI_API_KEYS_PARTAGE: ${{ secrets.GEMINI_API_KEYS_PARTAGE }}   # clés Gemini de Vid-o-presse-finder
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEYS_PLUS: ${{ secrets.GROQ_API_KEYS_PLUS }}
      CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      FALLBACK_LLM_KEYS: ${{ secrets.FALLBACK_LLM_KEYS }}
      YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
      YOUTUBE_API_KEYS_PLUS: ${{ secrets.YOUTUBE_API_KEYS_PLUS }}
      GUARDIAN_API_KEYS: ${{ secrets.GUARDIAN_API_KEYS }}
      NYT_API_KEYS: ${{ secrets.NYT_API_KEYS }}
      YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      # Telegram (facultatif) : session PROPRE à ce dépôt — jamais la même que celle de Vid-o-presse-finder
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      VPF_DIR: vpf
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      RCLONE_DEST: ${{ vars.RCLONE_DEST }}          # dossier Drive des résultats (vide = <stockage>:resultats)
      QF_CACHE_DIR: .cache
      QF_QUOTA_FILE: state/quota.json
      PYTHONPATH: vpf
      # 🔗 CHAÎNE (vide pour un montage lancé à la main ou par une release : rien ne change alors)
      CHAINE_ID: ${{ github.event.client_payload.chaine_id }}
      MONTAGE_CHAINE_SHORTS: ${{ inputs.chaine_shorts }}   # verrou : en chaîne, jamais de sous-titres dans la vidéo montée
      CHAINE_VIDEO_ID: ${{ github.event.client_payload.video_id }}
      CHAINE_FINDER: ${{ (github.event.client_payload.opts.finder || github.event.client_payload.finder) }}
      CHAINE_JOINTS: ${{ github.event.client_payload.joints }}
      CHAINE_ORIGINE: ${{ github.event.client_payload.origine }}
      CHAINE_RECHERCHE: ${{ (github.event.client_payload.opts.recherche || github.event.client_payload.recherche) }}   # légère (défaut) / non — choix fait dans le fond vert
    steps:
      - name: Début du job (le montage règle ses recherches sur le temps restant)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      # Tu peux lancer le Montage juste avant ou juste après « Préparer les médias » : il attend qu'il ait fini
      # (téléphone compris : 150 min max) avant de lire le dossier montage-joints. Rien ne tourne → aucune attente.
      - name: Attendre « Préparer les médias » s'il tourne encore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="repos/$GITHUB_REPOSITORY/actions/workflows/medias.yml/runs?per_page=20"
          now=$(date +%s); attendu=0
          # lancé AVANT « Préparer les médias » ? s'il n'y en a eu aucun depuis 3 h, on laisse 90 s pour qu'il apparaisse
          recent=$(gh api "$API" --jq "[.workflow_runs[] | select((.created_at | fromdateiso8601) > $((now - 10800)))] | length" 2>/dev/null || echo 1)
          grace=0; [ "${recent:-1}" = 0 ] && grace=3
          for i in $(seq 1 300); do
            n=$(gh api "$API" --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" = 0 ]; then
              [ "$i" -gt "$grace" ] && break
            else
              [ "$attendu" = 0 ] && echo "::notice title=Montage::« Préparer les médias » tourne : le montage attend qu'il ait fini, téléphone compris (150 min max)…"
              attendu=1
            fi
            sleep 30
          done
          [ "${n:-0}" = 0 ] || echo "::warning title=Montage::« Préparer les médias » dure plus de 150 min : le montage démarre avec ce qui est déjà dans montage-joints."
          # résultat de la dernière préparation (si elle date de moins de 3 h)
          r=$(gh api "$API" --jq "[.workflow_runs[] | select(.status == \"completed\" and ((.created_at | fromdateiso8601) > $((now - 10800))))][0] | \"\(.conclusion) \(.html_url)\"" 2>/dev/null || true)
          case "$r" in
            success*) echo "### 📥 Préparer les médias : ✅ terminé — [voir]( ${r#* })" >> "$GITHUB_STEP_SUMMARY"; echo "« Préparer les médias » terminé (réussi) : le montage démarre." ;;
            null*|"") : ;;
            *) echo "::warning title=Montage::« Préparer les médias » a fini en rouge (${r%% *} : il manquait des vidéos, ou un échec) : le montage utilise ce qui est dans montage-joints."
               echo "### 📥 Préparer les médias : ⚠ ${r%% *} — [voir]( ${r#* })" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      # Vidéos bloquées par YouTube : c'est « Préparer les médias » qui attend ton téléphone (60 min) et donne le verdict.
      # Ici on ne fait que le rappeler, sans attendre : quand tu lances le Montage, tout doit déjà être prêt.
      - name: Vidéos bloquées — rappel du verdict de « Préparer les médias » (aucune attente)
        if: env.RCLONE_CONF != ''
        continue-on-error: true
        run: |
          command -v rclone >/dev/null || curl -sSf --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
          command -v rclone >/dev/null || exit 0
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          R=$(grep -m1 -oE '^\[[^]]+\]' ~/.config/rclone/rclone.conf | tr -d '[]'); SM="$R:sources-medias"
          read -r run t _ <<< "$(rclone cat "$SM/telephone-demande.txt" 2>/dev/null | head -1)"
          [ -n "${run:-}" ] && [ $(( $(date +%s) - ${t:-0} )) -lt 21600 ] || exit 0          # pas de préparation récente
          nb=$(rclone cat "$SM/a-telecharger.txt" 2>/dev/null | grep -c '[^[:space:]]' || true)
          [ "${nb:-0}" -gt 0 ] || exit 0                                                       # rien de bloqué
          f=$(rclone cat "$SM/telephone-fini.txt" 2>/dev/null | head -1 || true)
          if [ "${f%% *}" = "$run" ]; then
            echo "### 📱 Téléphone : vidéos bloquées déposées (${f#* * })" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Montage::$nb vidéo(s) bloquée(s) par YouTube n'ont pas été déposées par ton téléphone : le montage se fait sans elles."
            echo "### 📱 $nb vidéo(s) bloquée(s) non déposées — montage sans elles" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v5

      - name: État de la release → ⏳ EN COURS
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'montage')
        run: |
          bash scripts/release-status.sh "$SRC_TAG" run "montage lancé — [suivre le travail](https://github.com/$REPO/actions/runs/${{ github.run_id }})"

      - name: Libérer de la place sur le disque (vidéos lourdes)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost &
          sleep 1; echo "nettoyage lancé en arrière-plan"

      - name: Cache des paquets apt
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-montage-v1-${{ runner.os }}

      - name: Outils (ffmpeg + libass, polices Noto dont l'arabe)
        run: |
          set -euo pipefail
          PKGS="ffmpeg fonts-noto-core fontconfig libraqm0 libfribidi0 jq tesseract-ocr"
          need=""; for p in $PKGS; do dpkg -s "$p" >/dev/null 2>&1 || need="$need $p"; done
          if [ -n "$need" ]; then
            mkdir -p ~/apt-archives/partial
            APT="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=4 -o Acquire::http::Timeout=25"
            ok=0
            for i in 1 2 3; do
              sudo timeout 300 apt-get update -qq $APT || true
              if sudo timeout 900 apt-get install -y -qq --no-install-recommends $APT $need; then ok=1; break; fi
              echo "::warning::apt : tentative $i échouée"; sleep 5
            done
            sudo chown -R "$USER" ~/apt-archives || true; sudo rm -f ~/apt-archives/lock || true
            [ "$ok" = 1 ] || { echo "::error::Installation de ffmpeg impossible"; exit 1; }
          fi
          ffmpeg -hide_banner -filters | grep -qw ass || { echo "::error::ffmpeg sans libass"; exit 1; }
          fc-cache -f >/dev/null; fc-list | grep -cE "Noto(Sans|Serif|NaskhArabic|SansArabic)-Bold" || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Moteur IA et recherche presse (Vid-o-presse-finder)
        run: |
          git clone -q --depth 1 https://github.com/MaxMcNeil/Vid-o-presse-finder vpf \
            || echo "::warning::Vid-o-presse-finder indisponible : IA en mode simple, pas de recherche presse"
          [ -f vpf/requirements.txt ] && pip install -q -r vpf/requirements.txt || true
          # PyPI parfois capricieux : 3 essais avant d'abandonner
          for i in 1 2 3; do pip install -q -r requirements.txt && ok=1 && break; ok=0; echo "::warning::pip : essai $i échoué"; sleep 15; done
          [ "$ok" = 1 ] || { echo "::error::Installation des outils Python impossible (PyPI injoignable ?) : relance le run"; exit 1; }
          pip install -q -U yt-dlp || echo "::warning::mise à jour de yt-dlp impossible (version déjà installée utilisée)"

      - name: Caches (modèle de transcription locale, réponses IA, état des quotas)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            .cache
            state
          key: montage-cache-${{ github.run_id }}
          restore-keys: montage-cache-

      - name: Chaîne — vérifier que tout est prêt (avant le montage)
        if: env.CHAINE_ID != ''
        env:
          JETON: ${{ (vars.CHAINE_APP_ID != '' && secrets.CHAINE_APP_KEY != '') || secrets.CHAINE_TOKEN != '' }}
        run: |
          echo "### 🔗 Chaîne \`$CHAINE_ID\` — synchro Finder : **${CHAINE_FINDER:-oui}** · fond vert : $CHAINE_ORIGINE" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$RCLONE_CONF" ] || { echo "::error title=Chaîne::secret RCLONE_CONF absent dans montage-lv-final (même compte Google que RCLONE_CONFIG du dépôt fond vert)."; exit 1; }
          [ "$JETON" = "true" ] || { echo "::error title=Chaîne::jeton absent dans montage-lv-final : variable CHAINE_APP_ID + secret CHAINE_APP_KEY (ou secret CHAINE_TOKEN). Sans lui, les Shorts ne pourraient pas être lancés."; exit 1; }

      - name: Récupérer la vidéo et les pièces jointes
        id: fetch
        env:
          SOURCE: ${{ inputs.source }}
          PIECES: ${{ inputs.pieces_jointes }}
          REPRENDRE_JOINTS: ${{ inputs.reprendre || (github.event.client_payload.opts.reprendre) || 'non' }}
          NOTES: ${{ inputs.consignes }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/fetch_inputs.py
          ls -la input input/attachments

      - name: État de la release → ⏳ EN COURS (lancement à la main avec un tag)
        # chaîne (repository_dispatch) et lancements sans release : non concernés
        if: github.event_name == 'workflow_dispatch' && steps.fetch.outputs.tag != '' && steps.fetch.outputs.skip != '1'
        env:
          SRC_TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          bash scripts/release-status.sh "$SRC_TAG" run "montage lancé — [suivre le travail](https://github.com/$REPO/actions/runs/${{ github.run_id }})"

      # ⏩ Vitesse (facultatif, défaut 1 = rien) : appliquée à TA vidéo AVANT le montage → transcription, coupes, cartes
      # et inserts sont calés sur la vidéo accélérée (aucun décalage). Le son est calé à l'image près sur la vidéo.
      # En chaîne depuis le fond vert (CHAINE_ID), la vitesse a déjà été appliquée là-bas : jamais deux fois.
      - name: Vitesse de ta parole (défaut 1 = inchangée)
        if: steps.fetch.outputs.skip != '1'
        env:
          VIT_IN: ${{ inputs.vitesse }}
          VID: ${{ steps.fetch.outputs.video }}
        run: |
          V="${VIT_IN:-}"
          if [ -z "$V" ] || [ "$V" = "1" ]; then   # réglage écrit dans la description de la release (« vitesse: 1.1 »)
            V=$(python3 -c "import json;print(json.load(open('input/options.json')).get('vitesse',''))" 2>/dev/null || true)
          fi
          V="${V:-1}"
          if python3 -c "import sys; sys.exit(0 if abs(float('${V//,/.}') - 1) < 0.001 else 1)" 2>/dev/null; then
            echo "Vitesse : normale (1)"; exit 0
          fi
          if [ -n "${CHAINE_ID:-}" ]; then
            echo "::notice title=Vitesse::chaîne depuis le fond vert : la vitesse y a déjà été appliquée — ×$V ignoré ici (jamais deux fois)"
            exit 0
          fi
          FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$VID" | head -1)
          case "$FR" in ""|0/0|0) FR=30 ;; esac
          bash scripts/vitesse.sh "$VID" - "$V" "$FR"
          echo "### ⏩ Vitesse ×$V appliquée à ta vidéo (voix inchangée, synchro à l'image près)" >> "$GITHUB_STEP_SUMMARY"

      - name: Montage (transcription, plan, médias, rendu)
        if: steps.fetch.outputs.skip != '1'
        env:
          SRC_TAG: ${{ steps.fetch.outputs.tag || github.event.release.tag_name }}
          MONTAGE_COUPER_SILENCES: ${{ inputs.couper_silences }}
          MONTAGE_SOUS_TITRES: ${{ inputs.sous_titres }}
          MONTAGE_OUVERTURE_CHOC: ${{ inputs.ouverture_choc }}
          MONTAGE_MOTS_CLES: ${{ inputs.mots_cles }}
          MONTAGE_EFFETS_SONORES: ${{ inputs.effets_sonores }}
          MONTAGE_CHAINE: ${{ inputs.chaine }}
          MONTAGE_VOIX_STUDIO: ${{ inputs.voix_studio || github.event.client_payload.voix_studio }}
          MONTAGE_VERSION_VERTICALE: ${{ inputs.version_verticale || 'auto' }}
          MONTAGE_FORMAT: ${{ inputs.format_sortie || (github.event.client_payload.opts.format_sortie || github.event.client_payload.format_sortie) || 'auto' }}
          MONTAGE_RECHERCHE_PRESSE: ${{ inputs.recherche_presse }}
        run: |
          mkdir -p fonts state
          if [ -n "${YT_COOKIES:-}" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"; export YT_COOKIES_FILE="$RUNNER_TEMP/yt-cookies.txt"; fi
          git -C vpf pull -q --depth 1 origin HEAD 2>/dev/null || true   # derniers résultats de Vid-o-presse-finder
          ls -1 vpf/results 2>/dev/null | grep -E '^[0-9]{4}-' | tail -3 || true
          python3 -m montage --video "${{ steps.fetch.outputs.video }}" --attachments input/attachments \
            --notes input/notes.txt --options input/options.json --out output --work work

      - name: Publier (release « out-montage » ou Google Drive)
        if: steps.fetch.outputs.skip != '1' && env.CHAINE_ID == ''
        id: pub
        env:
          SRC_TAG: ${{ steps.fetch.outputs.tag || github.event.release.tag_name }}
          BASE: ${{ steps.fetch.outputs.base }}
          CONSUMED: ${{ steps.fetch.outputs.consumed }}
          JOINTS_DOSSIER: ${{ steps.fetch.outputs.joints_dossier }}
        run: bash scripts/publish.sh

      - name: Chaîne — publier le montage (release out-chaine, 2 jours)
        id: pubc
        if: env.CHAINE_ID != ''
        env:
          BASE: ${{ steps.fetch.outputs.base }}
        run: bash scripts/chaine_suite.sh publier

      - name: Artifact (si ni release ni Drive)
        # chaîne : si la publication échoue, le montage rendu n'est jamais perdu (Artifacts du run, 14 jours)
        if: always() && (steps.pub.outputs.artifact == '1' || steps.pubc.outputs.artifact == '1' || (env.CHAINE_ID != '' && steps.pubc.outcome == 'failure'))
        uses: actions/upload-artifact@v6
        with:
          name: montage-final
          path: |
            output/A-PUBLIER-*.mp4
            output/pour-les-Shorts-*.mp4
            output/montage-final.mp4
            output/PLAN.md
          retention-days: 14

      - name: État de la release → ❌ ÉCHEC
        if: failure()
        env:
          SRC_TAG: ${{ steps.fetch.outputs.tag || github.event.release.tag_name }}
        run: |
          bash scripts/release-status.sh "$SRC_TAG" fail "voir l'erreur : [journal du run](https://github.com/$REPO/actions/runs/${{ github.run_id }})"

  # 🔗 CHAÎNE : job séparé et léger. S'il échoue (jeton, réseau…), « Re-run failed jobs » ne refait QUE ce lancement,
  # pas le montage. Le dossier montage-joints n'est vidé qu'ici, une fois les Shorts lancés.
  chaine-shorts:
    name: 🔗 Chaîne — lancer les Shorts
    needs: montage
    # chaîne depuis le fond vert, OU lancement à la main avec « chaine_shorts = oui » (montage déposé quelque part)
    if: >-
      (github.event_name == 'repository_dispatch' && needs.montage.outputs.chaine_id != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.chaine_shorts == 'oui' &&
       (needs.montage.outputs.video_url != '' || needs.montage.outputs.video_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - name: Jeton GitHub App
        id: chaine_tok
        if: vars.CHAINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          # identifiant de TON app, réglé dans chaque dépôt : variable CHAINE_CLIENT_ID si tu l'as créée,
          # sinon CHAINE_APP_ID (réglage d'origine, qui marchait) — jamais d'identifiant écrit en dur
          client-id: ${{ vars.CHAINE_CLIENT_ID }}
          app-id: ${{ vars.CHAINE_CLIENT_ID == '' && vars.CHAINE_APP_ID || '' }}
          private-key: ${{ secrets.CHAINE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Push-overlay

      - name: Lancer Video to Shorts (Push-overlay) puis vider montage-joints
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          CHAINE_GH_TOKEN: ${{ steps.chaine_tok.outputs.token || secrets.CHAINE_TOKEN }}
          CHAINE_ID: ${{ needs.montage.outputs.chaine_id || format('manuel-{0}', github.run_id) }}
          CHAINE_JOINTS: ${{ github.event.client_payload.joints }}
          SHORTS_SOUS_TITRES: ${{ inputs.shorts_sous_titres || github.event.client_payload.shorts_sous_titres || 'oui' }}
          VIDEO_URL: ${{ needs.montage.outputs.video_url }}
          VIDEO_ID: ${{ needs.montage.outputs.video_id }}
          VIDEO_NOM: ${{ needs.montage.outputs.video_nom }}
          # lancement à la main : montage-joints a déjà été vidé par la publication habituelle
          JOINTS_B64: ${{ github.event_name == 'repository_dispatch' && needs.montage.outputs.joints || '' }}
        run: bash scripts/chaine_suite.sh lancer
