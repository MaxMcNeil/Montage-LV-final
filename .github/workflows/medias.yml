name: 📥 Préparer les médias — avant le Montage

# Lancé UNIQUEMENT à la main (aucun cron).
# 1) Ton script est dans le dossier Drive (champ « script », par défaut montage-joints/script.txt) : la liste des
#    médias est écrite AUTOMATIQUEMENT (1 seule demande à l'IA : Gemini, sinon Groq), puis les médias sont récupérés.
# 2) Pas de script sur Drive : liste du dépôt (champ « liste », ou la plus récente du dossier medias/) — sans aucune clé.
# Dépose vidéos, photos libres et captures d'articles dans le dossier Drive montage-joints, prêts pour le Montage.
# Vidéos refusées par YouTube à GitHub : liste pour ton téléphone (Termux : bash tel_videos.sh).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Ton script de live sur Google Drive (.txt, .md, .docx ou .pdf) : la liste est écrite toute seule. VIDE = utiliser une liste du dépôt"
        default: "montage-joints/script.txt"
      liste:
        description: "Liste de médias (fichier du dépôt), si pas de script. VIDE = la plus récente du dossier medias/"
        default: ""
      sujets:
        description: "Sujets à récupérer : all, ou numéros séparés par des virgules (ex : 1 ou 1,3)"
        default: "all"
      dossier:
        description: "Dossier Drive de destination : montage-joints, autre chemin, ou ID de dossier Drive"
        default: "montage-joints"

concurrency:
  group: medias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  medias:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Outils (yt-dlp, ffmpeg, rclone)
        run: |
          [ -n "$RCLONE_CONF" ] || { echo "::error::secret RCLONE_CONF absent"; exit 1; }
          for i in 1 2 3; do pip install -q -U yt-dlp requests && break; sleep 10; done
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq --no-install-recommends poppler-utils || true
          for i in 1 2 3; do command -v rclone >/dev/null && break; curl -sSf --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sleep 5; done
          command -v rclone >/dev/null || { echo "::error::rclone non installé"; exit 1; }
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Ton script → liste des médias (1 demande à l'IA)
        id: auto
        if: inputs.script != ''
        env:
          SCRIPT_PATH: ${{ inputs.script }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
          GEMINI_API_KEYS_PARTAGE: ${{ secrets.GEMINI_API_KEYS_PARTAGE }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEYS_PLUS: ${{ secrets.GROQ_API_KEYS_PLUS }}
          FALLBACK_LLM_KEYS: ${{ secrets.FALLBACK_LLM_KEYS }}
        run: |
          REMOTE=$(grep -m1 -oE '^\[[^]]+\]' ~/.config/rclone/rclone.conf | tr -d '[]')
          P="${SCRIPT_PATH#*:}"
          mkdir -p script_in
          if ! rclone copyto "$REMOTE:$P" "script_in/$(basename "$P")" -q 2>/dev/null || [ ! -s "script_in/$(basename "$P")" ]; then
            echo "::notice::Pas de script « $P » sur Google Drive : liste du dépôt utilisée."
            exit 0
          fi
          if python3 scripts/liste_depuis_script.py "script_in/$(basename "$P")" auto-liste.txt; then
            echo "liste=auto-liste.txt" >> "$GITHUB_OUTPUT"
            echo "remote_script=$REMOTE:$P" >> "$GITHUB_OUTPUT"
            { echo "## 📝 Liste écrite depuis ton script « $P »"; echo; echo '```'; cat auto-liste.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Liste automatique impossible : liste du dépôt utilisée (ton script reste sur Drive)."
          fi

      - name: Récupérer et déposer sur Drive
        env:
          SUJETS: ${{ inputs.sujets }}
          DOSSIER: ${{ inputs.dossier }}
          LISTE_IN: ${{ steps.auto.outputs.liste || inputs.liste }}
        run: |
          LISTE="$LISTE_IN"
          [ -n "$LISTE" ] || LISTE=$(ls -t medias/*.txt 2>/dev/null | head -1)
          [ -f "$LISTE" ] || { echo "::error::liste introuvable : « $LISTE »"; exit 1; }
          export LISTE
          bash scripts/recup_medias.sh

      - name: Ranger ton script (jamais repris pour la vidéo suivante)
        if: success() && steps.auto.outputs.remote_script != ''
        env:
          SRC: ${{ steps.auto.outputs.remote_script }}
        run: |
          REMOTE="${SRC%%:*}"
          rclone moveto "$SRC" "$REMOTE:sources-medias/scripts/$(date -u +%Y%m%d-%H%M)-$(basename "${SRC#*:}")" -q \
            && echo "Ton script est rangé dans Drive « sources-medias/scripts » (et la liste écrite y est aussi)." \
            || echo "::warning::script non déplacé : retire-le de montage-joints avant ton prochain live"
          rclone copyto auto-liste.txt "$REMOTE:sources-medias/scripts/$(date -u +%Y%m%d-%H%M)-liste.txt" -q || true
